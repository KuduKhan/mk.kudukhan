name: Capture verified project screenshots

on:
  push:
    branches: [feature/portfolio-v2-5-case-studies]
    paths:
      - 'scripts/capture-showcase.mjs'
      - '.github/workflows/showcase-capture.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    if: github.repository == 'KuduKhan/mk.kudukhan' && github.ref == 'refs/heads/feature/portfolio-v2-5-case-studies'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install screenshot browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture public projects without credentials
        run: node scripts/capture-showcase.mjs
      - name: Commit verified captures to this branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/showcase/
          if ! git diff --cached --quiet; then
            git commit -m "docs: capture authentic public project screenshots"
            git push origin HEAD:feature/portfolio-v2-5-case-studies
          fi
